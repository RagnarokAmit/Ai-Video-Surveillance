<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video Surveillance</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css"
    >

    <!-- jQuery -->
    <script
        src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js">
    </script>

    <!-- Bootstrap JS -->
    <script
        src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js">
    </script>

    <!-- p5.js -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/p5.js">
    </script>

    <!-- ML5.js -->
    <script
        src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js">
    </script>

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        type="text/css"
        href="style.css"
    >

</head>


<body>

    <!-- Main Heading -->

    <div class="heading">

        <h1>
            AI Video Surveillance
        </h1>

    </div>


    <!-- Controls -->

    <div class="controls">

        <button
            onclick="start()"
            class="btn btn-success"
            id="start"
        >
            Start Detection
        </button>

        <button
            onclick="stopDetection()"
            class="btn btn-danger"
            id="stop"
        >
            Stop
        </button>

    </div>


    <!-- Status -->

    <div class="status-container">

        <h3 id="status">
            Status : Waiting
        </h3>

        <h3 id="number_of_objects">
            Objects Detected : 0
        </h3>

    </div>


    <!-- Canvas -->

    <div id="canvas-container"></div>


    <!-- Footer -->

    <div class="copy_right_footer">

        Developed by - Amit Vikram Mishra

    </div>


    <!-- Main JavaScript -->

    <script src="main.js"></script>

</body>

</html>
